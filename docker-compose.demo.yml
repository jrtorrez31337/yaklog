# yaklog demo-Plexus instance — full production-parity stack for the
# "What is Plexus" screenshot capture per Jon-direct 2026-07-08.
#
# Full parity per Jon-direct: all services that run locally on production
# stack (yaklog + OTel + Prom + Grafana + MinIO + TLS/Caddy) are required
# on demo, isolated at the VM level (no cross-cluster subscribe / export).
#
# Corrections in-arc:
# - Initial strip (yaklog only): killed cost/token/activity dashboard panels
#   fed by OTel/Prom. Restored OTel + Prom per admin #12163 + s345-aieng #12164.
# - Grafana/MinIO/TLS still absent: Jon flagged, adding for full parity.
#
# Isolation posture unchanged: fresh SQLite, fresh tokens, fresh OTel
# collector (agents emit HERE, not to production); fresh Prom scrape;
# fresh MinIO buckets; VM-level network isolation is the security boundary.

services:
  yaklog:
    build: .
    container_name: plexus-demo
    restart: unless-stopped
    env_file:
      - .env.demo
    ports:
      - "${YAKLOG_BIND_IP:-0.0.0.0}:3100:3100"
    volumes:
      - ./data:/data
      # GitHub PAT mount (optional): operator places a fine-grained PAT
      # at pat/github-pat (mode 0644) + sets GITHUB_PAT_FILE=/pat/github-pat
      # in .env.demo. Walker skips if empty. Ro-mount = never writable.
      - ./pat:/pat:ro

  # ────────────────────────────────────────────────────────────────────
  # Demo OTel collector — receives OTLP from Jon's real-fleet agents
  # (agents' OTEL_EXPORTER_OTLP_ENDPOINT points at 10.71.1.184:4328). Sister-
  # shape production ports 4327/4328 so agent config port-swaps cleanly.
  # Stage 1 auth: accepts any Bearer header; VM-level network isolation
  # is the security boundary — do NOT expose :4327/:4328 outside demo VM's
  # reachability domain.
  # ────────────────────────────────────────────────────────────────────
  plexus-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: plexus-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${PLEXUS_BIND_IP:-0.0.0.0}:4327:4317"  # OTLP gRPC
      - "${PLEXUS_BIND_IP:-0.0.0.0}:4328:4318"  # OTLP HTTP
      - "${PLEXUS_BIND_IP:-127.0.0.1}:13134:13133"  # healthcheck

  plexus-prometheus:
    image: prom/prometheus:v2.55.0
    container_name: plexus-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      # Demo-specific prometheus.yml — external_labels reflect plexus-demo
      # (production prometheus.yml has deployment: devel label; demo overrides)
      - ./otel/prometheus.demo.yml:/etc/prometheus/prometheus.yml:ro
      - plexus_prom_data:/prometheus
    ports:
      # 127.0.0.1-bound: Prometheus admin surface not needed off-VM
      # (only :3100 dashboard + :4327/:4328 OTel receivers need external reach)
      - "${PLEXUS_BIND_IP:-127.0.0.1}:9090:9090"
    depends_on:
      plexus-otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  plexus-grafana:
    image: grafana/grafana:11.6.0
    container_name: plexus-grafana
    restart: unless-stopped
    # Demo credentials live in a VM-local env file (fresh mint; NOT
    # shared with production plexus-grafana.env at /home/jon/.config/yaklog/).
    env_file:
      - ./plexus-grafana.demo.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/plexus.yaml:ro
      - ./otel/grafana-dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/plexus.yaml:ro
      - ./otel/grafana-dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - plexus_grafana_data:/var/lib/grafana
    ports:
      # 127.0.0.1-bound: Grafana admin surface not needed off-VM
      # (dashboard capture uses yaklog :3100, not Grafana)
      - "${PLEXUS_BIND_IP:-127.0.0.1}:3001:3000"
    depends_on:
      plexus-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ────────────────────────────────────────────────────────────────────
  # Demo MinIO — S3 Object Lock substrate for external audit anchor.
  # Fresh credentials in plexus-minio.demo.env (NOT shared with production).
  # 127.0.0.1-bound; not reachable outside demo VM (isolation posture).
  # ────────────────────────────────────────────────────────────────────
  plexus-minio:
    image: minio/minio:latest
    container_name: plexus-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    env_file:
      - ./plexus-minio.demo.env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - plexus_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ────────────────────────────────────────────────────────────────────
  # Demo TLS (Caddy) — DISABLED for demo.
  #
  # Production uses ./otel/Caddyfile.yaklog-tls + /etc/yaklog-tls certs, but
  # both are host-local (not in the yaklog bare-git repo). On the demo VM
  # neither exists; HTTP :3100 is what ptah-agent + s345 capture from, so
  # TLS is not on the capture path.
  #
  # To enable: (1) ferry a Caddyfile.yaklog-tls with the demo VM hostname,
  # (2) mount valid cert material at /etc/yaklog-tls on the demo VM.
  # ────────────────────────────────────────────────────────────────────
  # yaklog-tls:
  #   image: caddy:2-alpine
  #   container_name: yaklog-tls
  #   network_mode: "service:yaklog"
  #   depends_on:
  #     yaklog:
  #       condition: service_started
  #   volumes:
  #     - ./otel/Caddyfile.yaklog-tls:/etc/caddy/Caddyfile:ro
  #     - /etc/yaklog-tls:/etc/yaklog-tls:ro
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

volumes:
  plexus_prom_data:
  plexus_grafana_data:
  plexus_minio_data:
