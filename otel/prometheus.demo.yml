# Yaklog Prometheus config — DEMO variant of otel/prometheus.yml.
# Only delta: external_labels reflect yaklog-demo, not devel.
#
# Retention 15 days for Stage 1 (set via --storage.tsdb.retention.time
# in docker-compose command args).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: yaklog-demo
    deployment: demo

scrape_configs:
  # Self-scrape: Prom monitoring itself; standard practice.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Yaklog OTel collector — scrapes the collector's prometheus exporter
  # which receives OTLP from real-fleet agents and re-exposes as Prom metrics.
  # Container DNS name on yaklog-demo_default network.
  - job_name: yaklog-otel-collector
    static_configs:
      - targets: ['yaklog-otel-collector:8889']
        labels:
          source: otel-collector
