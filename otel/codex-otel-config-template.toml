# Yaklog Codex CLI OTel config template
# Per ADR-0032 Phase 0 Item A (yaklog-dev #9577 PLAN-ADR-0032-PHASE-0-CROSS-RUNTIME-TELEMETRY-PARITY.md).
#
# Install: merge into ~/.codex/config.toml on the agent's seat.
# Source-of-truth at: <install-dir>/otel/codex-otel-config-template.toml
#
# Per feedback_yaklog_identity_overlay_not_columns + feedback_secrets_no_yaklog:
#   - log_user_prompt = false (PII discipline; prompts never leave the seat
#     via OTel; cluster substrate-truth preserved)
#
# Stage 1 collector accepts any Bearer per Plan C Stage 1 network-isolation
# security model. PRODUCTION must upgrade per Plan C Stage 1 §7 risks.

[otel]
environment = "yaklog-devel"
log_user_prompt = false
exporter = "otlp-grpc"

[otel.otlp-grpc]
endpoint = "http://localhost:4327"

[otel.otlp-grpc.headers]
Authorization = "Bearer yaklog-placeholder"
