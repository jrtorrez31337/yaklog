services:
  yaklog:
    build: .
    container_name: yaklog
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${YAKLOG_BIND_IP:-0.0.0.0}:3100:3100"
      - "${YAKLOG_BIND_IP:-0.0.0.0}:3443:3443"
    volumes:
      - yaklog_data:/data
      - ${YAKLOG_SPEC_FILE:-./spec.md}:/data/spec.md:ro
      - ${YAKLOG_SPEC_DIR_HOST:-/home/jon/agents/global}:/data/canonical:ro
      - ${YAKLOG_BARE_GIT_HOST:-/srv/git}:/srv/git:ro
      - ${YAKLOG_FERRY_AUDIT_HOST:-/var/log/yaklog}:/var/log/yaklog:rw
      # CP13.6 Phase 2.2 GitHub PAT for GitHubWalker per parch #9866 ratify.
      # Mounted read-only; container reads via GITHUB_PAT_FILE env var below.
      - /etc/plexus/github-pat.token:/etc/plexus/github-pat.token:ro
      # Task #138 Phase 2A vendor-key delivery substrate per parch #10320 +
      # ssw-devops #10288 OOB age-key ferry. yaklog-runtime age private key
      # is read by src/secureStore/sopsAge.js when invoking `sops --decrypt`
      # on vendor-keys/*.sops.env files in swarm-secrets.git. Mode 0600
      # root:root on host (sister-shape github-pat.token); container UID=0
      # matches host mode for read.
      - /etc/plexus/yaklog-runtime.age.key:/etc/plexus/yaklog-runtime.age.key:ro
    environment:
      GITHUB_PAT_FILE: /etc/plexus/github-pat.token

  # ──────────────────────────────────────────────────────────────────────
  # Plexus OTel stack (Plan C Stage 1; Jon-ratified 2026-05-24).
  # Side-by-side with ssw-jaeger/ssw-grafana (different tech stack per Jon).
  # All three services join yaklog_default network so they can address
  # each other by service name (plexus-otel-collector / plexus-prometheus).
  # External port shifts avoid ssw-* collisions: 4327/4328/3001 vs ssw's
  # 4317/4318/3000.
  # ──────────────────────────────────────────────────────────────────────

  plexus-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: plexus-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # External OTLP receivers (shifted +10 to avoid ssw-jaeger 4317/4318)
      - "${PLEXUS_BIND_IP:-0.0.0.0}:4327:4317"  # OTLP gRPC
      - "${PLEXUS_BIND_IP:-0.0.0.0}:4328:4318"  # OTLP HTTP
      # Healthcheck (shifted from 13133 to avoid ssw-jaeger)
      - "${PLEXUS_BIND_IP:-127.0.0.1}:13134:13133"
    # NOTE: the otel-collector-contrib image is distroless (no shell, no
    # wget, no curl). Docker's HEALTHCHECK runs in-container, so we can't
    # use the normal "wget the /health endpoint" pattern. Two options
    # considered: (a) drop healthcheck + use service_started for depends_on,
    # (b) embed a static `grpc_health_probe` binary via a custom Dockerfile.
    # Stage 1: option (a). External smoke verifies port 13134 returns 200.
    # If Stage 2 needs in-container healthcheck (e.g., for orchestrator-
    # driven restarts), revisit with a custom image.

  plexus-prometheus:
    image: prom/prometheus:v2.55.0
    container_name: plexus-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - plexus_prom_data:/prometheus
    ports:
      - "${PLEXUS_BIND_IP:-0.0.0.0}:9090:9090"
    depends_on:
      plexus-otel-collector:
        condition: service_started  # collector is distroless; no in-container healthcheck (see above)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  plexus-grafana:
    image: grafana/grafana:11.6.0
    container_name: plexus-grafana
    restart: unless-stopped
    # CP4 hardening 2026-05-25: admin creds moved to per-host env_file
    # outside this repo. The file at ${PLEXUS_GRAFANA_ENV_FILE:-...} MUST
    # exist on the host BEFORE first-time `docker compose up`, OR the
    # container will spin up with Grafana's default admin/admin (security
    # hole). Production deploys should fail-fast on missing file; for
    # devel we accept the env_file lookup will error out the container
    # which is fail-safe enough.
    env_file:
      - ${PLEXUS_GRAFANA_ENV_FILE:-/home/jon/.config/yaklog/plexus-grafana.env}
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      # Provisioning paths
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/plexus.yaml:ro
      - ./otel/grafana-dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/plexus.yaml:ro
      - ./otel/grafana-dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - plexus_grafana_data:/var/lib/grafana
    ports:
      # Shifted to 3001 (ssw-grafana has 3000)
      - "${PLEXUS_BIND_IP:-0.0.0.0}:3001:3000"
    depends_on:
      plexus-prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s


  # ──────────────────────────────────────────────────────────────────────
  # Plexus MinIO (CP12.21 Phase 3 (A) external integrity anchor hosting).
  # Per Jon-direct 2026-06-09 (#8236): substrate-choice α S3 Object Lock
  # canonical (parch #7984 OQ-3 ratify) + hosting flips AWS S3 → local
  # MinIO on devel (brand-narrative alignment: cluster-self-substrate canon).
  # 127.0.0.1-bound (devel-internal; no internet exposure).
  # ──────────────────────────────────────────────────────────────────────

  plexus-minio:
    image: minio/minio:latest
    container_name: plexus-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - plexus_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  yaklog-tls:
    image: caddy:2-alpine
    container_name: yaklog-tls
    network_mode: "service:yaklog"
    depends_on:
      yaklog:
        condition: service_started
    volumes:
      - ./otel/Caddyfile.yaklog-tls:/etc/caddy/Caddyfile:ro
      - /etc/yaklog-tls:/etc/yaklog-tls:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  plexus_minio_data:
  yaklog_data:
  plexus_prom_data:
  plexus_grafana_data:
